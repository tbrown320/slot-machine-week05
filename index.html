<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="machine">
        <h1>Slot O'Matic</h1>
        <p>Starting Balance: $1000</p>
        <p id="current-balance">Current Balance: </p>
        <br>
        <label for="bet">Bet: </label>
        <input type="number" id="bet" name="bet" min="5" max="50" placeholder="5">
        <button id="submit">Pull the Lever!</button>
        <section class="reels">
            <section id="first-reel">Reel 1</section>
            <section id="second-reel">Reel 2</section>
            <section id="third-reel">Reel 3</section>
        </section>
        <p id="result"></p>
    </section>


    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
